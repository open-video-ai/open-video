name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import smoke
        run: |
          python -c "from core.backend import ModelBackend, ShotRequest, Capabilities; print('core OK')"
          python -c "from core.pipeline import LongFilmPipeline, Shot; print('pipeline OK')"
          python -c "from core.judge import QualityJudge, Verdict; print('judge OK')"
          python -c "from core.h3_weights import inventory_h3_int8, known_models; assert 'h3' in known_models(); print('h3_weights OK')"
          python -c "from core.resources import recommend_quant; print(recommend_quant(32768, has_nvidia=True).quant)"

      - name: CLI smoke (no GPU)
        run: |
          python cli/open_video.py list-models
          python cli/open_video.py recommend-quant --vram 8192 --json
          python cli/open_video.py pull h3 --check-only || true
          python cli/open_video.py "sunset waves" --dry-run

  lint-shell:
    name: install.sh policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer structure tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_install_sh_policy.py -q --tb=short
